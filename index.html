<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1000 Limit Oyun Merkezi</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .hub {
            width: 100%;
            max-width: 460px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 22px;
            padding: 26px 22px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 14px;
            text-align: center;
            margin-bottom: 22px;
        }
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .game-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 18px;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.12s, border-color 0.2s, background 0.2s;
        }
        .game-card:active {
            transform: scale(0.98);
        }
        .game-card:hover {
            border-color: #58a6ff;
            background: #131c28;
        }
        .emoji {
            font-size: 42px;
            flex-shrink: 0;
        }
        .title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .desc {
            font-size: 13px;
            color: #8b949e;
            line-height: 1.4;
        }
        .arrow {
            margin-left: auto;
            font-size: 20px;
            color: #58a6ff;
        }
    </style>
</head>
<body>
    <div class="hub">
        <h1>🎮 Oyun Seç</h1>
        <p class="subtitle">Oynamak istediğin oyuna dokun</p>

        <div class="game-list">
            <a href="hiz.html" class="game-card">
                <div class="emoji">🏎️</div>
                <div>
                    <div class="title">1000 KM/H Aşırı Hız</div>
                    <div class="desc">Basılı tutarak hızlan, trafikten kaç ve 1000 km/h sınırında patla!</div>
                </div>
                <div class="arrow">➔</div>
            </a>

            <a href="yanardag.html" class="game-card">
                <div class="emoji">🌋</div>
                <div>
                    <div class="title">Yanardağ 1000 Bar</div>
                    <div class="desc">Seri dokun veya SPACE ile basıncı 1000 bar'a çıkar ve patlat!</div>
                </div>
                <div class="arrow">➔</div>
            </a>
        </div>
    </div>
</body>
</html>
