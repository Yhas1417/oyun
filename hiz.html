<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1000 KM/H Aşırı Hız</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
            border-left: 2px solid #30363d;
            border-right: 2px solid #30363d;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            pointer-events: none;
            z-index: 10;
        }
        .menu-link {
            pointer-events: auto;
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid #30363d;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .stat-box {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid #30363d;
            padding: 9px 13px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }
        #speed-display {
            font-size: 25px;
            font-weight: 900;
            color: #58a6ff;
            font-variant-numeric: tabular-nums;
        }
        #heat-bar-container {
            width: 100%;
            height: 7px;
            background: #21262d;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }
        #heat-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3fb950, #d29922, #f85149);
            transition: width 0.05s linear;
        }
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(13, 17, 23, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            z-index: 20;
        }
        #overlay h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }
        #overlay p {
            color: #8b949e;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 19px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.95);
        }
        .overlay-menu-btn {
            margin-top: 14px;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.45);
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <a href="index.html" class="menu-link">🏠 Menü</a>
        <div class="stat-box" style="flex: 1;">
            <div style="font-size: 11px; color: #8b949e;">LİMİT: 1000 KM/H</div>
            <div id="speed-display">0 <span style="font-size: 13px;">km/h</span></div>
            <div id="heat-bar-container">
                <div id="heat-bar"></div>
            </div>
        </div>
        <div class="stat-box" style="text-align: right;">
            <div style="font-size: 11px; color: #8b949e;">DURUM</div>
            <div id="status-emoji" style="font-size: 25px;">🏎️</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls-hint">
        GAZ: Ekrana Basılı Tut / SPACE • YÖN: Sürükle veya Sağ/Sol Ok
    </div>

    <div id="overlay">
        <div id="overlay-emoji" style="font-size: 62px; margin-bottom: 10px;">🚀</div>
        <h1 id="overlay-title">1000 KM/H</h1>
        <p id="overlay-desc">
            Ekrana basılı tutarak hızlan! Hızlandıkça trafik sıklaşır ve aracın ısınır.<br><br>
            ⚠️ <strong>1000 km/h</strong> sınırına ulaşırsan motor aşırı yüklenip <strong>PATLAR!</strong> 💥
        </p>
        <button id="start-btn" type="button">GAZA BAS 🔥</button>
        <a href="index.html" class="overlay-menu-btn">← Oyun Seçimine Dön</a>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const speedDisplay = document.getElementById('speed-display');
    const heatBar = document.getElementById('heat-bar');
    const statusEmoji = document.getElementById('status-emoji');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const overlayEmoji = document.getElementById('overlay-emoji');
    const startBtn = document.getElementById('start-btn');

    let width = 360;
    let height = 640;

    function resize() {
        const parent = canvas.parentElement;
        width = canvas.width = Math.max(200, parent.clientWidth || window.innerWidth || 360);
        height = canvas.height = Math.max(300, parent.clientHeight || window.innerHeight || 640);
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = false;
    let isAccelerating = false;
    let speed = 0;
    let playerX = width / 2;
    let targetX = width / 2;
    let obstacles = [];
    let particles = [];
    let roadOffset = 0;
    let frameCount = 0;
    let shakeIntensity = 0;
    let animFrameId = null;

    const obstacleEmojis = ['🚕', '🚙', '🚌', '🚚', '🚧', '🛢️', '🪨'];

    function startGas(e) {
        if (!isPlaying) return;
        isAccelerating = true;
        updatePointer(e);
    }

    function stopGas() {
        isAccelerating = false;
    }

    function updatePointer(e) {
        if (!isPlaying || !isAccelerating) return;
        const rect = canvas.getBoundingClientRect();
        let clientX = (e && e.touches && e.touches[0]) ? e.touches[0].clientX : (e ? e.clientX : undefined);
        if (clientX !== undefined) {
            targetX = clientX - rect.left;
        }
    }

    canvas.addEventListener('mousedown', startGas);
    canvas.addEventListener('mousemove', updatePointer);
    window.addEventListener('mouseup', stopGas);

    canvas.addEventListener('touchstart', (e) => {
        if (!isPlaying) return;
        e.preventDefault();
        startGas(e);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        if (!isPlaying) return;
        e.preventDefault();
        updatePointer(e);
    }, { passive: false });

    window.addEventListener('touchend', stopGas);
    window.addEventListener('touchcancel', stopGas);

    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            isAccelerating = true;
        }
    });
    window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            isAccelerating = false;
        }
    });

    function resetGame() {
        resize();
        speed = 0;
        playerX = width / 2;
        targetX = width / 2;
        obstacles = [];
        particles = [];
        shakeIntensity = 0;
        isAccelerating = false;
        isPlaying = true;
        overlay.style.display = 'none';

        if (animFrameId) cancelAnimationFrame(animFrameId);
        animFrameId = requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener('click', resetGame);

    function createParticles(x, y, emojis, count, speedMult = 1) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const velocity = (Math.random() * 6 + 2) * speedMult;
            particles.push({
                x, y,
                vx: Math.cos(angle) * velocity,
                vy: Math.sin(angle) * velocity,
                emoji: emojis[Math.floor(Math.random() * emojis.length)],
                size: Math.random() * 20 + 16,
                life: 1.0
            });
        }
    }

    function endGame(reason) {
        isPlaying = false;
        isAccelerating = false;

        if (reason === 'exploded') {
            createParticles(playerX, height - 110, ['💥', '🔥', '💨', '⚡', '🔩'], 35, 1.8);
            shakeIntensity = 25;
            overlayEmoji.textContent = '💥';
            overlayTitle.textContent = '1000 KM/H! PATLADIN!';
            overlayTitle.style.color = '#f85149';
            overlayDesc.innerHTML = 'Motor aşırı hıza dayanamadı ve infilak etti!<br>Maksimum sınıra ulaştın!';
        } else {
            createParticles(playerX, height - 110, ['💥', '💢', '💨'], 15, 1);
            shakeIntensity = 12;
            overlayEmoji.textContent = '🚑';
            overlayTitle.textContent = 'KAZA YAPTIN!';
            overlayTitle.style.color = '#d29922';
            overlayDesc.innerHTML = `Ulaşılan Maksimum Hız: <strong>${Math.floor(speed)} km/h</strong><br>Hızlandıkça reflekslerin daha da keskin olmalı!`;
        }

        setTimeout(() => {
            startBtn.textContent = 'TEKRAR DENE 🔄';
            overlay.style.display = 'flex';
        }, 600);
    }

    function update() {
        frameCount++;

        const moveSpeed = 7 + (speed / 150);
        if (keys['ArrowLeft'] || keys['KeyA']) targetX -= moveSpeed;
        if (keys['ArrowRight'] || keys['KeyD']) targetX += moveSpeed;

        targetX = Math.max(35, Math.min(width - 35, targetX));
        playerX += (targetX - playerX) * 0.2;

        if (isAccelerating) {
            speed += 0.75 + (speed * 0.0012);
        } else {
            speed = Math.max(0, speed - 1.5);
        }

        if (speed >= 1000) {
            speed = 1000;
            updateHUD();
            endGame('exploded');
            return;
        }

        shakeIntensity = speed > 600 ? ((speed - 600) / 400) * 8 : Math.max(0, shakeIntensity - 0.5);

        if (isAccelerating && frameCount % 3 === 0) {
            const exhaustEmoji = speed > 800 ? '🔥' : (speed > 400 ? '⚡' : '💨');
            particles.push({
                x: playerX + (Math.random() * 14 - 7),
                y: height - 85,
                vx: (Math.random() - 0.5) * 1.5,
                vy: Math.random() * 4 + 3,
                emoji: exhaustEmoji,
                size: speed > 700 ? 22 : 16,
                life: 0.7
            });
        }

        const spawnRate = Math.max(12, Math.floor(55 - (speed / 22)));
        if (speed > 30 && frameCount % spawnRate === 0) {
            const laneWidth = Math.max(40, width - 80);
            obstacles.push({
                x: 40 + Math.random() * laneWidth,
                y: -50,
                emoji: obstacleEmojis[Math.floor(Math.random() * obstacleEmojis.length)],
                size: 36,
                speedOffset: Math.random() * 2 + 1
            });
        }

        const fallSpeed = 3 + (speed / 35);
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.y += fallSpeed + obs.speedOffset;

            if (Math.abs(playerX - obs.x) < 26 && Math.abs((height - 110) - obs.y) < 28) {
                endGame('crashed');
                return;
            }

            if (obs.y > height + 60) obstacles.splice(i, 1);
        }

        roadOffset = (roadOffset + fallSpeed * 1.5) % 80;
        updateHUD();
    }

    function updateHUD() {
        speedDisplay.innerHTML = `${Math.floor(speed)} <span style="font-size: 13px;">km/h</span>`;
        heatBar.style.width = `${(speed / 1000) * 100}%`;

        if (speed < 250) { speedDisplay.style.color = '#58a6ff'; statusEmoji.textContent = '🏎️'; }
        else if (speed < 550) { speedDisplay.style.color = '#3fb950'; statusEmoji.textContent = '⚡'; }
        else if (speed < 850) { speedDisplay.style.color = '#d29922'; statusEmoji.textContent = '🔥'; }
        else { speedDisplay.style.color = '#f85149'; statusEmoji.textContent = '🥵'; }
    }

    function draw() {
        ctx.save();
        if (shakeIntensity > 0) {
            ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
        }
        ctx.clearRect(0, 0, width, height);

        if (speed > 650) {
            ctx.fillStyle = `rgba(248, 81, 73, ${((speed - 650) / 350) * 0.25})`;
            ctx.fillRect(0, 0, width, height);
        }

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 4;
        ctx.setLineDash([40, 40]);
        ctx.lineDashOffset = -roadOffset;
        for (let i = 1; i < 3; i++) {
            const x = (width / 3) * i;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }
        ctx.setLineDash([]);

        if (speed > 400) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${(speed - 400) / 1500})`;
            ctx.lineWidth = 2;
            for (let i = 0; i < 6; i++) {
                const lx = ((frameCount * 37 + i * 97) % width);
                const ly = ((frameCount * (speed / 25) + i * 150) % height);
                ctx.beginPath();
                ctx.moveTo(lx, ly);
                ctx.lineTo(lx, ly + 40 + (speed / 15));
                ctx.stroke();
            }
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let obs of obstacles) {
            ctx.font = `${obs.size}px Arial`;
            ctx.fillText(obs.emoji, obs.x, obs.y);
        }

        if (isPlaying) {
            ctx.font = '44px Arial';
            const carJitter = speed > 800 ? (Math.random() - 0.5) * 4 : 0;
            ctx.fillText('🏎️', playerX + carJitter, height - 110);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 0.03;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.font = `${p.size}px Arial`;
            ctx.fillText(p.emoji, p.x, p.y);
        }
        ctx.globalAlpha = 1.0;
        ctx.restore();
    }

    function gameLoop() {
        if (isPlaying) update();
        draw();
        if (isPlaying || particles.length > 0) {
            animFrameId = requestAnimationFrame(gameLoop);
        }
    }
</script>
</body>
</html>
