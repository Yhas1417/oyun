<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seçimli Tıklama Oyunu</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            touch-action: manipulation;
        }
        #app {
            width: 100%;
            max-width: 480px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 6px;
            text-align: center;
        }
        .subtitle {
            color: #8b949e;
            font-size: 14px;
            text-align: center;
            margin-bottom: 18px;
        }
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        .mode-card {
            background: #0d1117;
            border: 2px solid #30363d;
            border-radius: 14px;
            padding: 14px 16px;
            text-align: left;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.12s, border-color 0.2s, background 0.2s;
            touch-action: manipulation;
        }
        .mode-card:active {
            transform: scale(0.98);
        }
        .mode-card.selected {
            border-color: #58a6ff;
            background: #132033;
        }
        .mode-emoji {
            font-size: 32px;
            flex-shrink: 0;
        }
        .mode-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .mode-desc {
            font-size: 13px;
            color: #8b949e;
        }
        .btn {
            width: 100%;
            background: #238636;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: #21262d;
            border: 1px solid #30363d;
            margin-top: 10px;
            font-size: 15px;
            padding: 12px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .hud-label {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
        }
        .hud-val {
            font-size: 20px;
            font-weight: 800;
            color: #58a6ff;
        }
        .progress-wrap {
            width: 100%;
            height: 10px;
            background: #21262d;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 18px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3fb950, #d29922, #f85149);
            transition: width 0.08s linear;
        }
        .click-stage {
            position: relative;
            height: 250px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 14px;
        }
        #target-btn {
            font-size: 76px;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.07s ease;
            touch-action: manipulation;
            z-index: 2;
        }
        #target-btn:active {
            transform: scale(0.84);
        }
        .stage-hint {
            margin-top: 10px;
            font-size: 13px;
            color: #8b949e;
            z-index: 2;
        }
        .floating-emoji {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.75s ease-out forwards;
            z-index: 3;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.9);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% - 75px)) scale(1.35);
            }
        }
        .shake {
            animation: shakeAnim 0.22s infinite;
        }
        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-4px, 2px); }
            50% { transform: translate(4px, -2px); }
            75% { transform: translate(-3px, -2px); }
            100% { transform: translate(0, 0); }
        }
        .result-box {
            text-align: center;
            padding: 12px 0 18px;
        }
        .result-emoji {
            font-size: 68px;
            margin-bottom: 10px;
        }
        .result-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .result-text {
            font-size: 15px;
            color: #8b949e;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- 1. SEÇİM EKRANI -->
    <div id="select-screen" class="screen active">
        <h1>🎯 Ne Olsun?</h1>
        <p class="subtitle">Tıkladıkça ne gerçekleşeceğini seç ve hedefe ulaş!</p>

        <div class="mode-grid">
            <button type="button" class="mode-card selected" data-mode="volcano">
                <span class="mode-emoji">🌋</span>
                <div>
                    <div class="mode-title">Yanardağ Patlaması</div>
                    <div class="mode-desc">Tıkladıkça basınç artar, zirvede lav ve taşlar patlar! 🪨🔥</div>
                </div>
            </button>

            <button type="button" class="mode-card" data-mode="rocket">
                <span class="mode-emoji">🚀</span>
                <div>
                    <div class="mode-title">Roket Fırlatma</div>
                    <div class="mode-desc">Motoru ateşle, irtifa kazan ve uzayda yıldızlara ulaş! 🌟✨</div>
                </div>
            </button>

            <button type="button" class="mode-card" data-mode="party">
                <span class="mode-emoji">🎁</span>
                <div>
                    <div class="mode-title">Sürpriz Hediye Kutusu</div>
                    <div class="mode-desc">Kilidi aç, kutuyu şişir ve konfeti patlaması yaşa! 🎉🥳</div>
                </div>
            </button>
        </div>

        <button type="button" id="start-btn" class="btn">SEÇİMLE BAŞLA ▶️</button>
    </div>

    <!-- 2. OYUN EKRANI -->
    <div id="game-screen" class="screen">
        <div class="hud">
            <div>
                <div class="hud-label">Senaryo</div>
                <div id="hud-mode" class="hud-val" style="font-size: 16px;">🌋 Yanardağ</div>
            </div>
            <div style="text-align: center;">
                <div class="hud-label">Tıklama</div>
                <div id="hud-clicks" class="hud-val">0</div>
            </div>
            <div style="text-align: right;">
                <div class="hud-label">Hedef</div>
                <div id="hud-goal" class="hud-val">50</div>
            </div>
        </div>

        <div class="progress-wrap">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="click-stage" class="click-stage">
            <button type="button" id="target-btn">🌋</button>
            <div id="stage-hint" class="stage-hint">Hızlıca dokun!</div>
        </div>

        <button type="button" id="change-mode-btn" class="btn btn-secondary">🔄 Senaryoyu Değiştir</button>
    </div>

    <!-- 3. FİNAL EKRANI -->
    <div id="result-screen" class="screen">
        <div class="result-box">
            <div id="result-emoji" class="result-emoji">💥</div>
            <div id="result-title" class="result-title">PATLADI!</div>
            <p id="result-text" class="result-text"></p>
        </div>
        <button type="button" id="replay-btn" class="btn">TEKRAR OYNA 🔁</button>
        <button type="button" id="back-menu-btn" class="btn btn-secondary">🎯 Başka Senaryo Seç</button>
    </div>
</div>

<script>
    const MODES = {
        volcano: {
            name: '🌋 Yanardağ',
            goal: 50,
            baseEmoji: '🌋',
            midEmojis: ['♨️', '🔥', '🪨', '🌋'],
            burstEmojis: ['💥', '🔥', '🌋', '🪨', '⚡'],
            hint: 'Basıncı artır! 50 tıklamada patlayacak...',
            finalEmoji: '💥',
            finalTitle: 'YANARDAĞ PATLADI!',
            finalText: 'Basınç zirveye çıktı ve lavlar gökyüzüne fırladı! 🌋🔥🪨'
        },
        rocket: {
            name: '🚀 Roket',
            goal: 60,
            baseEmoji: '🚀',
            midEmojis: ['💨', '🔥', '✨', '🚀'],
            burstEmojis: ['🚀', '🌟', '✨', '🛸', '🌍'],
            hint: 'İtkiyi artır! 60 tıklamada yörüngeye çıkacak...',
            finalEmoji: '🌟',
            finalTitle: 'UZAYA FIRLATILDI!',
            finalText: 'Atmosferi aştın ve yıldızların arasına ulaştın! 🚀✨🌍'
        },
        party: {
            name: '🎁 Hediye',
            goal: 40,
            baseEmoji: '🎁',
            midEmojis: ['🎀', '✨', '🎈', '🎁'],
            burstEmojis: ['🎉', '🎊', '🥳', '🎁', '🎈'],
            hint: 'Kutuyu şişir! 40 tıklamada sürpriz patlayacak...',
            finalEmoji: '🎉',
            finalTitle: 'SÜRPRİZ PATLADI!',
            finalText: 'Hediye kutusu açıldı ve ortalık konfeti doldu! 🎉🎊🥳'
        }
    };

    let selectedModeKey = 'volcano';
    let clicks = 0;
    let finished = false;

    const selectScreen = document.getElementById('select-screen');
    const gameScreen = document.getElementById('game-screen');
    const resultScreen = document.getElementById('result-screen');

    const modeCards = document.querySelectorAll('.mode-card');
    const startBtn = document.getElementById('start-btn');
    const targetBtn = document.getElementById('target-btn');
    const clickStage = document.getElementById('click-stage');
    const hudMode = document.getElementById('hud-mode');
    const hudClicks = document.getElementById('hud-clicks');
    const hudGoal = document.getElementById('hud-goal');
    const progressBar = document.getElementById('progress-bar');
    const stageHint = document.getElementById('stage-hint');

    const resultEmoji = document.getElementById('result-emoji');
    const resultTitle = document.getElementById('result-title');
    const resultText = document.getElementById('result-text');
    const replayBtn = document.getElementById('replay-btn');
    const backMenuBtn = document.getElementById('back-menu-btn');
    const changeModeBtn = document.getElementById('change-mode-btn');

    function showScreen(screenEl) {
        [selectScreen, gameScreen, resultScreen].forEach(s => s.classList.remove('active'));
        screenEl.classList.add('active');
    }

    modeCards.forEach(card => {
        card.addEventListener('click', () => {
            modeCards.forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedModeKey = card.dataset.mode;
        });
    });

    function spawnFloatingEmoji(emoji, x, y, dx = (Math.random() - 0.5) * 90) {
        const el = document.createElement('span');
        el.className = 'floating-emoji';
        el.textContent = emoji;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.setProperty('--dx', `${dx}px`);
        clickStage.appendChild(el);
        setTimeout(() => el.remove(), 750);
    }

    function startGame() {
        const mode = MODES[selectedModeKey];
        clicks = 0;
        finished = false;

        hudMode.textContent = mode.name;
        hudClicks.textContent = '0';
        hudGoal.textContent = String(mode.goal);
        progressBar.style.width = '0%';
        targetBtn.textContent = mode.baseEmoji;
        targetBtn.style.transform = 'scale(1)';
        stageHint.textContent = mode.hint;
        clickStage.classList.remove('shake');

        showScreen(gameScreen);
    }

    function handleTap(e) {
        if (finished) return;
        const mode = MODES[selectedModeKey];
        clicks += 1;

        const ratio = Math.min(1, clicks / mode.goal);
        hudClicks.textContent = String(clicks);
        progressBar.style.width = `${ratio * 100}%`;

        // Hedefe yaklaştıkça ölçek büyür ve sarsıntı başlar
        const scale = 1 + ratio * 0.45;
        targetBtn.style.transform = `scale(${scale.toFixed(2)})`;
        if (ratio >= 0.7) {
            clickStage.classList.add('shake');
        }

        const rect = clickStage.getBoundingClientRect();
        let clientX = rect.width / 2;
        let clientY = rect.height / 2;
        if (e && e.clientX && e.clientY) {
            clientX = e.clientX - rect.left;
            clientY = e.clientY - rect.top;
        }

        const popEmoji = mode.midEmojis[Math.floor(Math.random() * mode.midEmojis.length)];
        spawnFloatingEmoji(popEmoji, clientX, clientY);

        if (clicks >= mode.goal) {
            finished = true;
            clickStage.classList.remove('shake');

            for (let i = 0; i < 18; i++) {
                const burstEmoji = mode.burstEmojis[i % mode.burstEmojis.length];
                const bx = rect.width / 2 + (Math.random() - 0.5) * 120;
                const by = rect.height / 2 + (Math.random() - 0.5) * 90;
                const dx = (Math.random() - 0.5) * 220;
                spawnFloatingEmoji(burstEmoji, bx, by, dx);
            }

            setTimeout(() => {
                resultEmoji.textContent = mode.finalEmoji;
                resultTitle.textContent = mode.finalTitle;
                resultText.textContent = mode.finalText;
                showScreen(resultScreen);
            }, 450);
        }
    }

    startBtn.addEventListener('click', startGame);
    targetBtn.addEventListener('click', handleTap);
    replayBtn.addEventListener('click', startGame);
    changeModeBtn.addEventListener('click', () => showScreen(selectScreen));
    backMenuBtn.addEventListener('click', () => showScreen(selectScreen));
</script>
</body>
</html>
