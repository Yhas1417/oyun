<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yanardağ 1000 Bar Patlaması</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            touch-action: manipulation;
            overflow: hidden;
        }
        #app {
            width: 100%;
            max-width: 480px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }
        .hud {
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .hud-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 10px 14px;
        }
        .hud-label {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .hud-val {
            font-size: 23px;
            font-weight: 900;
            color: #58a6ff;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
        }
        .hud-sub {
            font-size: 12px;
            color: #8b949e;
            margin-top: 2px;
        }
        .bar-wrap {
            width: 100%;
            height: 12px;
            background: #21262d;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 14px;
            border: 1px solid #30363d;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3fb950 0%, #d29922 45%, #f85149 80%, #ff1e1e 100%);
            transition: width 0.05s linear;
        }
        #stage {
            position: relative;
            height: 315px;
            background: radial-gradient(circle at 50% 65%, #231715 0%, #0d1117 75%);
            border: 1px solid #30363d;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 14px;
        }
        #volcano-btn {
            font-size: 86px;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.05s ease;
            touch-action: manipulation;
            z-index: 3;
            line-height: 1;
        }
        #volcano-btn:active,
        #volcano-btn.pressed {
            transform: scale(0.86);
        }
        #stage-status {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #c9d1d9;
            z-index: 3;
            text-align: center;
            padding: 0 12px;
        }
        #stage-hint {
            margin-top: 4px;
            font-size: 12px;
            color: #8b949e;
            z-index: 3;
        }
        .vent-hazard {
            position: absolute;
            font-size: 24px;
            cursor: pointer;
            z-index: 4;
            background: rgba(13, 17, 23, 0.9);
            border: 1.5px solid #58a6ff;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.18s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.3); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .float-emoji {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.75s ease-out forwards;
            z-index: 2;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.85);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% - 85px)) scale(1.35);
            }
        }
        .shake-low { animation: shakeLow 0.18s infinite; }
        .shake-high { animation: shakeHigh 0.1s infinite; }
        @keyframes shakeLow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2px, 2px); }
        }
        @keyframes shakeHigh {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-6px, 3px); }
            50% { transform: translate(6px, -3px); }
            75% { transform: translate(-4px, -3px); }
            100% { transform: translate(0, 0); }
        }
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(13, 17, 23, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 20;
        }
        #overlay.active {
            display: flex;
        }
        .modal {
            width: 100%;
            max-width: 400px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
        }
        .btn {
            width: 100%;
            background: #238636;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="hud">
        <div class="hud-box">
            <div class="hud-label">Magma Basıncı</div>
            <div id="pressure-val" class="hud-val">0.0 bar</div>
            <div class="hud-sub">Patlama Eşiği: 1000.0 bar</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">Zorluk & Kayıp</div>
            <div id="difficulty-val" class="hud-val" style="font-size: 18px; color: #3fb950;">Sakin</div>
            <div id="decay-val" class="hud-sub">-8.0 bar/sn</div>
        </div>
    </div>

    <div class="bar-wrap">
        <div id="pressure-bar" class="bar-fill"></div>
    </div>

    <div id="stage">
        <button type="button" id="volcano-btn">🏔️</button>
        <div id="stage-status">Magma Odası Sakin</div>
        <div id="stage-hint">Seri dokun veya SPACE pompalayarak basıncı yükselt!</div>
    </div>

    <div style="font-size: 12px; color: #8b949e; text-align: center; line-height: 1.4;">
        ⚠️ Yüksek basınçta kaçak çok şiddetlenir. Beliren ❄️/💧 soğutma çatlaklarını hızla kapat!
    </div>
</div>

<div id="overlay">
    <div class="modal">
        <div style="font-size: 72px; margin-bottom: 10px;">💥</div>
        <h2 style="font-size: 25px; color: #f85149; margin-bottom: 8px;">1000.0 BAR! SÜPER PATLAMA!</h2>
        <p id="final-stats" style="color: #c9d1d9; font-size: 15px; line-height: 1.5;"></p>
        <button type="button" id="restart-btn" class="btn">YENİDEN PATLAT (SPACE) 🌋</button>
    </div>
</div>

<script>
    const MAX_PRESSURE = 1000.0; // bar
    let pressure = 0.0;
    let isPointerHolding = false;
    let isSpaceHolding = false;
    let exploded = false;
    let startTime = Date.now();
    let totalTaps = 0;
    let lastFrame = performance.now();
    let hazardTimer = 0;

    const pressureVal = document.getElementById('pressure-val');
    const difficultyVal = document.getElementById('difficulty-val');
    const decayVal = document.getElementById('decay-val');
    const pressureBar = document.getElementById('pressure-bar');
    const stage = document.getElementById('stage');
    const volcanoBtn = document.getElementById('volcano-btn');
    const stageStatus = document.getElementById('stage-status');
    const stageHint = document.getElementById('stage-hint');
    const overlay = document.getElementById('overlay');
    const finalStats = document.getElementById('final-stats');
    const restartBtn = document.getElementById('restart-btn');

    function isHolding() {
        return isPointerHolding || isSpaceHolding;
    }

    function getStageConfig(p) {
        if (p < 200) {
            return {
                emoji: '🏔️',
                label: 'Sakin',
                color: '#3fb950',
                status: 'Yeraltı Isınıyor',
                particles: ['💨', '🪨', '🌫️'],
                tapGain: 14.0,
                holdGain: 22.0,
                baseDecay: 8.0,
                hazardInterval: 999
            };
        } else if (p < 450) {
            return {
                emoji: '🌋',
                label: 'Aktif',
                color: '#58a6ff',
                status: 'Duman & Kül Çıkışı',
                particles: ['💨', '♨️', '🪨'],
                tapGain: 12.0,
                holdGain: 26.0,
                baseDecay: 22.0,
                hazardInterval: 2.6
            };
        } else if (p < 700) {
            return {
                emoji: '🌋',
                label: 'Tehlikeli',
                color: '#d29922',
                status: 'Magma Yükseliyor!',
                particles: ['🔥', '♨️', '🪨', '💨'],
                tapGain: 10.2,
