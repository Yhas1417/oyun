<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yanardağ Basınç Patlaması</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            touch-action: manipulation;
            overflow: hidden;
        }
        #app {
            width: 100%;
            max-width: 480px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }
        .hud {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .hud-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 10px 14px;
        }
        .hud-label {
            font-size: 11px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .hud-val {
            font-size: 24px;
            font-weight: 900;
            color: #58a6ff;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
        }
        .hud-sub {
            font-size: 12px;
            color: #8b949e;
            margin-top: 2px;
        }
        .bar-wrap {
            width: 100%;
            height: 12px;
            background: #21262d;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 14px;
            border: 1px solid #30363d;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3fb950 0%, #d29922 50%, #f85149 85%, #ff2a2a 100%);
            transition: width 0.05s linear;
        }
        #stage {
            position: relative;
            height: 310px;
            background: radial-gradient(circle at 50% 65%, #1f1715 0%, #0d1117 75%);
            border: 1px solid #30363d;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 14px;
        }
        #volcano-btn {
            font-size: 86px;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.06s ease;
            touch-action: manipulation;
            z-index: 3;
            line-height: 1;
        }
        #volcano-btn:active {
            transform: scale(0.88);
        }
        #stage-status {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #c9d1d9;
            z-index: 3;
            text-align: center;
            padding: 0 12px;
        }
        #stage-hint {
            margin-top: 4px;
            font-size: 12px;
            color: #8b949e;
            z-index: 3;
        }
        .vent-hazard {
            position: absolute;
            font-size: 26px;
            cursor: pointer;
            z-index: 4;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid #58a6ff;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.2s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.3); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .float-emoji {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.75s ease-out forwards;
            z-index: 2;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.85);
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% - 85px)) scale(1.35);
            }
        }
        .shake-low { animation: shakeLow 0.2s infinite; }
        .shake-high { animation: shakeHigh 0.12s infinite; }
        @keyframes shakeLow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-2px, 2px); }
        }
        @keyframes shakeHigh {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-5px, 3px); }
            50% { transform: translate(5px, -3px); }
            75% { transform: translate(-4px, -3px); }
            100% { transform: translate(0, 0); }
        }
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(13, 17, 23, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 20;
        }
        #overlay.active {
            display: flex;
        }
        .modal {
            width: 100%;
            max-width: 400px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
        }
        .btn {
            width: 100%;
            background: #238636;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="hud">
        <div class="hud-box">
            <div class="hud-label">Magma Basıncı</div>
            <div id="pressure-val" class="hud-val">0.0 bar</div>
            <div class="hud-sub">Patlama Eşiği: 250.0 bar</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">Zorluk & Kayıp</div>
            <div id="difficulty-val" class="hud-val" style="font-size: 18px; color: #3fb950;">Sakin</div>
            <div id="decay-val" class="hud-sub">-2.0 bar/sn</div>
        </div>
    </div>

    <div class="bar-wrap">
        <div id="pressure-bar" class="bar-fill"></div>
    </div>

    <div id="stage">
        <button type="button" id="volcano-btn">🏔️</button>
        <div id="stage-status">Magma Odası Sakin</div>
        <div id="stage-hint">Basıncı artırmak için hızlıca dokun veya basılı tut!</div>
    </div>

    <div style="font-size: 12px; color: #8b949e; text-align: center; line-height: 1.4;">
        ⚠️ Bıraktığında basınç hızla düşer. Yüksek basınçta beliren ❄️/💧 soğutma çatlaklarına dokunarak kapat!
    </div>
</div>

<div id="overlay">
    <div class="modal">
        <div style="font-size: 72px; margin-bottom: 10px;">💥</div>
        <h2 style="font-size: 26px; color: #f85149; margin-bottom: 8px;">250.0 BAR! BÜYÜK PATLAMA!</h2>
        <p id="final-stats" style="color: #c9d1d9; font-size: 15px; line-height: 1.5;"></p>
        <button type="button" id="restart-btn" class="btn">YENİDEN PATLAT 🌋</button>
    </div>
</div>

<script>
    const MAX_PRESSURE = 250.0; // bar
    let pressure = 0.0;
    let isHolding = false;
    let exploded = false;
    let startTime = Date.now();
    let totalTaps = 0;
    let lastFrame = performance.now();
    let hazardTimer = 0;

    const pressureVal = document.getElementById('pressure-val');
    const difficultyVal = document.getElementById('difficulty-val');
    const decayVal = document.getElementById('decay-val');
    const pressureBar = document.getElementById('pressure-bar');
    const stage = document.getElementById('stage');
    const volcanoBtn = document.getElementById('volcano-btn');
    const stageStatus = document.getElementById('stage-status');
    const stageHint = document.getElementById('stage-hint');
    const overlay = document.getElementById('overlay');
    const finalStats = document.getElementById('final-stats');
    const restartBtn = document.getElementById('restart-btn');

    function getStageConfig(p) {
        if (p < 50) {
            return {
                emoji: '🏔️',
                label: 'Sakin',
                color: '#3fb950',
                status: 'Yeraltı Isınıyor',
                particles: ['💨', '🪨', '🌫️'],
                gainMult: 1.0,
                baseDecay: 3.5,
                hazardInterval: 999
            };
        } else if (p < 110) {
            return {
                emoji: '🌋',
                label: 'Aktif',
                color: '#58a6ff',
                status: 'Duman & Kül Çıkışı',
                particles: ['💨', '♨️', '🪨'],
                gainMult: 0.85,
                baseDecay: 7.5,
                hazardInterval: 3.6
            };
        } else if (p < 175) {
            return {
                emoji: '🌋',
                label: 'Tehlikeli',
                color: '#d29922',
                status: 'Magma Yükseliyor!',
                particles: ['🔥', '♨️', '🪨', '💨'],
                gainMult: 0.68,
                baseDecay: 13.0,
                hazardInterval: 2.5
            };
        } else if (p < 220) {
            return {
                emoji: '🔥',
                label: 'Kritik',
                color: '#f85149',
                status: 'Krater Çatlıyor!',
                particles: ['🔥', '🌋', '⚡', '🪨'],
                gainMult: 0.54,
                baseDecay: 19.5,
                hazardInterval: 1.8
            };
        } else {
            return {
                emoji: '🧨',
                label: 'Aşırı Yük!',
                color: '#ff2a2a',
                status: 'PATLAMAYA RAMAK KALDI!',
                particles: ['💥', '🔥', '⚡', '🌋'],
                gainMult: 0.44,
                baseDecay: 26.0,
                hazardInterval: 1.3
            };
        }
    }

    function spawnFloat(emoji, x, y, dx = (Math.random() - 0.5) * 110) {
        const el = document.createElement('span');
        el.className = 'float-emoji';
        el.textContent = emoji;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.setProperty('--dx', `${dx}px`);
        stage.appendChild(el);
        setTimeout(() => el.remove(), 750);
    }

    function spawnCoolingHazard() {
        if (stage.querySelectorAll('.vent-hazard').length >= 3) return;
        const hz = document.createElement('button');
        hz.type = 'button';
        hz.className = 'vent-hazard';
        hz.textContent = Math.random() > 0.5 ? '❄️' : '💧';

        const rect = stage.getBoundingClientRect();
        const x = 28 + Math.random() * Math.max(60, rect.width - 56);
        const y = 28 + Math.random() * Math.max(60, rect.height - 90);
        hz.style.left = `${x}px`;
        hz.style.top = `${y}px`;

        const closeHazard = (e) => {
            e.stopPropagation();
            spawnFloat('💨', x + 20, y + 20, 0);
            hz.remove();
        };
        hz.addEventListener('click', closeHazard);
        hz.addEventListener('touchstart', (e) => { e.preventDefault(); closeHazard(e); }, { passive: false });

        stage.appendChild(hz);
        setTimeout(() => {
            if (hz.parentNode) hz.remove();
        }, 4000);
    }

    function boostPressure(amount, clientX, clientY) {
        if (exploded) return;
        const cfg = getStageConfig(pressure);
        pressure = Math.min(MAX_PRESSURE, pressure + amount * cfg.gainMult);

        const rect = stage.getBoundingClientRect();
        const fx = clientX ? clientX - rect.left : rect.width / 2;
        const fy = clientY ? clientY - rect.top : rect.height / 2;
        const pEmoji = cfg.particles[Math.floor(Math.random() * cfg.particles.length)];
        spawnFloat(pEmoji, fx, fy);

        if (pressure >= MAX_PRESSURE) {
            triggerExplosion();
        }
    }

    function triggerExplosion() {
        exploded = true;
        isHolding = false;
        stage.classList.remove('shake-low', 'shake-high');
        stage.querySelectorAll('.vent-hazard').forEach(el => el.remove());

        const rect = stage.getBoundingClientRect();
        const boomEmojis = ['💥', '🔥', '🌋', '🪨', '⚡', '💨'];
        for (let i = 0; i < 26; i++) {
            const em = boomEmojis[i % boomEmojis.length];
            const bx = rect.width / 2 + (Math.random() - 0.5) * 100;
            const by = rect.height / 2 + (Math.random() - 0.5) * 80;
            const dx = (Math.random() - 0.5) * 260;
            spawnFloat(em, bx, by, dx);
        }

        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        finalStats.innerHTML = `Yanardağ <strong>250.0 bar</strong> basınca dayanamadı ve infilak etti!<br><br>⏱️ Süre: <strong>${elapsed} sn</strong> • 👆 Dokunuş: <strong>${totalTaps}</strong>`;

        setTimeout(() => {
            overlay.classList.add('active');
        }, 550);
    }

    volcanoBtn.addEventListener('pointerdown', (e) => {
        if (exploded) return;
        isHolding = true;
        totalTaps += 1;
        boostPressure(4.2, e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', () => { isHolding = false; });
    window.addEventListener('pointercancel', () => { isHolding = false; });

    function loop(now) {
        const dt = Math.min(0.1, (now - lastFrame) / 1000);
        lastFrame = now;

        if (!exploded) {
            const cfg = getStageConfig(pressure);
            const activeHazards = stage.querySelectorAll('.vent-hazard').length;

            // Basılı tutarken sürekli basınç artışı, bırakıldığında hızlı basınç kaybı
            if (isHolding) {
                pressure += (15.0 * cfg.gainMult) * dt;
                if (Math.random() < 0.25) {
                    const rect = stage.getBoundingClientRect();
                    const em = cfg.particles[Math.floor(Math.random() * cfg.particles.length)];
                    spawnFloat(em, rect.width / 2, rect.height / 2 - 10);
                }
            } else {
                const totalDecay = cfg.baseDecay + activeHazards * 6.5;
                pressure = Math.max(0, pressure - totalDecay * dt);
            }

            // Aktif soğutma çatlakları basılı tutarken bile basıncı emer
            if (activeHazards > 0) {
                pressure = Math.max(0, pressure - (activeHazards * 5.5) * dt);
            }

            if (pressure >= MAX_PRESSURE) {
                pressure = MAX_PRESSURE;
                triggerExplosion();
            }

            // Zorluk arttıkça soğutma çatlakları çıkar
            if (cfg.hazardInterval < 100) {
                hazardTimer += dt;
                if (hazardTimer >= cfg.hazardInterval) {
                    hazardTimer = 0;
                    spawnCoolingHazard();
                }
            }

            // Arayüz & Emoji Güncelleme
            const ratio = pressure / MAX_PRESSURE;
            pressureVal.textContent = `${pressure.toFixed(1)} bar`;
            pressureVal.style.color = cfg.color;
            difficultyVal.textContent = cfg.label;
            difficultyVal.style.color = cfg.color;
            decayVal.textContent = `-${(cfg.baseDecay + activeHazards * 6.5).toFixed(1)} bar/sn`;
            pressureBar.style.width = `${ratio * 100}%`;

            volcanoBtn.textContent = cfg.emoji;
            volcanoBtn.style.transform = `scale(${(1 + ratio * 0.42).toFixed(2)})`;
            stageStatus.textContent = cfg.status;
            stageHint.textContent = isHolding
                ? 'Basınç yükseliyor! Bırakırsan düşer!'
                : 'Bıraktın! Basınç hızla düşüyor...';

            stage.classList.remove('shake-low', 'shake-high');
            if (pressure >= 185) {
                stage.classList.add('shake-high');
            } else if (pressure >= 110) {
                stage.classList.add('shake-low');
            }
        }

        requestAnimationFrame(loop);
    }

    restartBtn.addEventListener('click', () => {
        pressure = 0.0;
        isHolding = false;
        exploded = false;
        totalTaps = 0;
        hazardTimer = 0;
        startTime = Date.now();
        stage.querySelectorAll('.vent-hazard').forEach(el => el.remove());
        overlay.classList.remove('active');
    });

    requestAnimationFrame(loop);
</script>
</body>
</html>
